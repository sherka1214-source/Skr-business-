<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKR Platform</title>
<style>
/* ========== CSS START ========== */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#1e293b;position:sticky;top:0}
header img{width:50px;height:50px;border-radius:8px}
nav button{padding:8px 15px;margin-left:10px;background:#22c55e;border:none;border-radius:6px;color:#fff;cursor:pointer}
.slider{position:relative;height:300px;overflow:hidden}
.slide{position:absolute;width:100%;height:100%;display:none}
.slide img{width:100%;height:100%;object-fit:cover}
.slide.active{display:block}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding:40px}
.card{background:#1e293b;padding:20px;border-radius:10px;text-align:center}
.panel{padding:40px;max-width:500px;margin:auto;background:#1e293b;border-radius:10px;margin-top:20px}
input{width:100%;padding:10px;margin:10px 0;border-radius:6px;border:none}
.hidden{display:none}
/* ========== CSS END ========== */
</style>
</head>
<body>

<!-- ========== HEADER ========== -->
<header>
  <img src="images/logo.png" alt="SKR Logo">
  <h2>SKR Platform</h2>
  <nav>
    <button onclick="showPanel('loginPanel')">Login</button>
    <button onclick="showPanel('signupPanel')">Signup</button>
    <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
  </nav>
</header>

<!-- ========== SLIDER ========== -->
<div class="slider" id="slider">
  <div class="slide active"><img src="images/slide1.jpg"></div>
  <div class="slide"><img src="images/slide2.jpg"></div>
  <div class="slide"><img src="images/slide3.jpg"></div>
</div>

<!-- ========== TEAM ========== -->
<section class="team" id="team">
  <div class="card"><img src="images/team1.jpg" width="100"><h3>Ahmed</h3><p>CEO</p></div>
  <div class="card"><img src="images/team2.jpg" width="100"><h3>Sara</h3><p>Manager</p></div>
</section>

<!-- ========== USER PANEL ========== -->
<div id="loginPanel" class="panel hidden">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="signupPanel" class="panel hidden">
  <h2>Signup</h2>
  <input id="signupName" placeholder="Full Name">
  <input id="signupEmail" placeholder="Email">
  <input id="signupPass" type="password" placeholder="Password">
  <button onclick="signup()">Create Account</button>
</div>

<div id="userPanel" class="panel hidden">
  <h2>Welcome <span id="userName"></span></h2>
  <p>Balance: $<span id="balance">0</span></p>
  <input id="depositAmount" placeholder="Deposit Amount">
  <button onclick="requestDeposit()">Request Deposit</button>
  <input id="withdrawAmount" placeholder="Withdraw Amount">
  <button onclick="requestWithdraw()">Request Withdrawal</button>
</div>

<!-- ========== ADMIN PANEL ========== -->
<div id="adminPanel" class="panel hidden">
  <h2>Admin Panel</h2>
  <h3>Pending Requests</h3>
  <div id="requests"></div>
</div>

<!-- ========== JS START ========== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

// TUMHARI FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyARX24b0EnCmh-3WcYfy9wtgj5vpHUNEPQ",
  authDomain: "sherry-project-1214.firebaseapp.com",
  projectId: "sherry-project-1214",
  storageBucket: "sherry-project-1214.firebasestorage.app",
  messagingSenderId: "692003406873",
  appId: "1:692003406873:web:e38c4b3806d963b5761688",
  measurementId: "G-2RPT4PEXHX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ========== PANEL SWITCH ==========
function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'))
  document.getElementById(id).classList.remove('hidden')
}

// ========== AUTH ==========
async function signup(){
  const name = document.getElementById('signupName').value
  const email = document.getElementById('signupEmail').value
  const pass = document.getElementById('signupPass').value
  const userCred = await createUserWithEmailAndPassword(auth, email, pass)
  await setDoc(doc(db, "users", userCred.user.uid), {name, email, balance:0, role:"user"})
  alert("Account Created")
}

async function login(){
  const email = document.getElementById('loginEmail').value
  const pass = document.getElementById('loginPass').value
  await signInWithEmailAndPassword(auth, email, pass)
}

function logout(){ signOut(auth) }

onAuthStateChanged(auth, async (user)=>{
  if(user){
    document.getElementById('logoutBtn').classList.remove('hidden')
    const snap = await getDoc(doc(db, "users", user.uid))
    const data = snap.data()
    document.getElementById('userName').innerText = data.name
    document.getElementById('balance').innerText = data.balance
    if(data.role == "admin"){ showPanel('adminPanel') }
    else { showPanel('userPanel') }
  } else {
    document.getElementById('logoutBtn').classList.add('hidden')
  }
})

// ========== DEPOSIT / WITHDRAW ==========
async function requestDeposit(){
  const amount = document.getElementById('depositAmount').value
  await addDoc(collection(db, "requests"), {type:"deposit", amount, uid:auth.currentUser.uid, status:"pending"})
  alert("Deposit Request Sent")
}

async function requestWithdraw(){
  const amount = document.getElementById('withdrawAmount').value
  await addDoc(collection(db, "requests"), {type:"withdraw", amount, uid:auth.currentUser.uid, status:"pending"})
  alert("Withdrawal Request Sent")
}

// ========== SLIDER AUTO ==========
let i=0; setInterval(()=>{
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'))
  document.querySelectorAll('.slide')[i].classList.add('active')
  i=(i+1)%3
},3000)
</script>
<!-- ========== JS END ========== -->
</body>
</html>
